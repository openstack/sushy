[build-system]
requires = ["pbr>=6.1.1"]
build-backend = "pbr.build"

[project]
name = "sushy"
description = "Sushy is a small Python library to communicate with Redfish based systems"
authors = [
    {name = "OpenStack", email = "openstack-discuss@lists.openstack.org"},
]
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "Apache-2.0"
dynamic = ["version", "dependencies"]
requires-python = ">=3.11"
classifiers = [
    "Environment :: OpenStack",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.urls]
Homepage = "https://docs.openstack.org/sushy/"
Repository = "https://opendev.org/openstack/sushy/"
"Bug Tracker" = "https://bugs.launchpad.net/sushy"

[project.entry-points."sushy.resources.manager.oems"]
dell = "sushy.oem.dell.resources.manager.manager:get_extension"

[project.entry-points."sushy.resources.storage_controller.oems"]
dell = "sushy.oem.dell.resources.system.storage.controller:get_extension"

[project.entry-points."sushy.resources.system.oems"]
contoso = "sushy.resources.oem.fake:get_extension"
dell = "sushy.oem.dell.resources.system.system:get_extension"

[project.entry-points."sushy.resources.task.oems"]
dell = "sushy.oem.dell.resources.taskservice.task:get_extension"
baremetal = "ironicclient.osc.plugin"

[tool.setuptools.packages.find]
include = ["sushy*"]

[tool.doc8]
ignore = ["D001"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",        # pycodestyle (error)
    "F",        # pyflakes
    "G",        # flake8-logging-format
    "LOG",      # flake8-logging
    "RUF",      # ruff-specific rules
    "S",        # flake8-bandit
    "UP",       # pyupgrade
    "W",        # pycodestyle (warning)
]
ignore = [
    "S101",     # asserts are used for type narrowing
    # the following are ignored because they don't provide enough value for
    # the changes required
    "RUF012",   # mutable default value for class attribute
]
# hacking (H) checks and flake8's E501 (which, unlike ruff, flags long URLs)
# are still run by the hacking pre-commit hook, so don't remove their noqa
external = ["H", "E501"]

[tool.ruff.lint.per-file-ignores]
"sushy/tests/oem/dell/unit/resources/taskservice/test_task.py" = [
    "RUF001",   # expected values contain NO-BREAK SPACE, as returned by iDRAC
]
"sushy/tests/**/*.py" = [
    "S104",     # disable 'hardcoded_bind_all_interfaces' for tests
    "S105",     # disable 'hardcoded_password_string' for tests
    "S106",     # disable 'hardcoded_password_funcarg' for tests
]

[tool.codespell]
quiet-level = 4
# Words to ignore:
# assertIn: used in unit testing
ignore-words-list = "assertIn"
skip = "AUTHORS,ChangeLog,*.pyc,*.inv,*.svg,*.png,*.sample,./doc/build/*,./api-ref/build/*,./releasenotes/build/*,./api-ref/build/*,./build/*"
